name: Feature request
description: Suggest an improvement and describe the need.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Explain the use case without customer or personal information.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior and alternatives
    validations:
      required: true
